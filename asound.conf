# Template / documentation copy.
# start.sh rewrites /etc/asound.conf at container start with the actual
# Inferno name, Device ID, process ID, port, clock path and bind address.

pcm.dante {
    type plug
    slave.pcm "dante_mono"
}

pcm.dante_mono {
    type route
    slave.pcm "dante_mix"
    slave.channels 1

    # Stereo L/R -> Mono
    ttable.0.0 0.5
    ttable.1.0 0.5
}

# Shared output used both by Librespot and the permanent silence keepalive.
pcm.dante_mix {
    type dmix
    ipc_key 59090
    ipc_key_add_uid true
    ipc_perm 0666

    slave {
        pcm "inferno_raw"
        format S32_LE
        rate 48000
        channels 1
        period_time 10000
        buffer_time 40000
    }

    bindings {
        0 0
    }
}

pcm.inferno_raw {
    type inferno
}
