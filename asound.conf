# Template / documentation copy.
# start.sh rewrites /etc/asound.conf at container start with the actual
# Inferno name, Device ID, process ID, port, clock path and interface.

pcm.dante {
    type plug
    slave.pcm "dante_mono"

    hint {
        show on
        description "Spotify to mono Dante output via Inferno"
    }
}

pcm.dante_mono {
    type route
    slave.pcm "inferno_raw"
    slave.channels 1

    # Stereo L/R -> Mono
    ttable.0.0 0.5
    ttable.1.0 0.5
}

pcm.inferno_raw {
    type inferno

    hint {
        show on
        description "Raw Inferno Dante PCM"
    }
}
