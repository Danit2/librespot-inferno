services:
  spotify-dante:
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    container_name: spotify-dante
    environment:
      AP_PORT: '443'
      BACKEND: alsa
      BITRATE: '320'
      CLOCK_PATH: /shared/usrvclock
      CLOCK_SOCKET: /shared/usrvclock
      CLOCK_STARTUP_DELAY: '20'
      DEVICE: dante
      DEVICE_NAME: Feuer und Eis
      DEVICE_TYPE: speaker
      ENABLE_SYSTEM_CACHE: 'Y'
      FORMAT: S32
      INFERNO_ALT_PORT: '15800'
      INFERNO_BIND_IP: 169.254.1.19
      INFERNO_CLOCK_PATH: /shared/usrvclock
      INFERNO_DEVICE_ID: '0000020000001081'
      INFERNO_NAME: Spotify-Dante
      INFERNO_PROCESS_ID: '90'
      INFERNO_RX_CHANNELS: '0'
      INFERNO_TX_CHANNELS: '1'
      INITIAL_VOLUME: '100'
      KEEP_DANTE_ALIVE: 'true'
      SAMPLE_RATE: '48000'
      SPOTIFY_PIPE_RATE: '44100'
      TMPDIR: /shared/tmp_spotify
      TZ: Europe/Zurich
      WAIT_FOR_CLOCK: 'true'
      ZEROCONF_BACKEND: libmdns
      ZEROCONF_INTERFACE: 10.22.232.201
    image: ghcr.io/danit2/librespot-inferno:latest
    network_mode: host
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock: -1
      rtprio: 99
    volumes:
      - /mnt/app/inferno-shared:/shared
      - inferno-state-spotify:/root/.local/state/inferno_aoip
      - spotify-system-cache:/data/system-cache
volumes:
  inferno-state-spotify: {}
  spotify-system-cache: {}
